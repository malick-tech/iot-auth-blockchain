name: iot-auth

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iot_auth_db
      POSTGRES_USER: malick
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malick"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.4
    environment:
      PGADMIN_DEFAULT_EMAIL: malickass1998@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis

  nodered:
    image: nodered/node-red:4.0
    environment:
      - TZ=Africa/Dakar
      - BACKEND_BASE_URL=http://host.docker.internal:8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_SHARED_SECRET=${IOT_AUTH_GATEWAY_SHARED_SECRET:-dev-gateway-secret}
    ports:
      - '1880:1880'
    volumes:
      - ../gateway/node-red-data:/data
    depends_on:
      - redis

volumes:
  postgres-data:
  redis-data:
