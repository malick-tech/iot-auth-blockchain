name: iot-auth

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iot_auth_db
      POSTGRES_USER: malick
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini (voir .env.example)}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malick"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # default : mot de passe (backend, Redis Commander). gateway : compte a moindre privilege,
    # lecture (HGETALL) sur device:*, ecriture (SET NX PX) limitee a op_proof_used:*.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --user gateway on ">$$REDIS_GATEWAY_PASSWORD" "%R~device:*" "%W~op_proof_used:*"
        -@all +hgetall +set +info +ping
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD doit etre defini (voir .env.example)}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?REDIS_GATEWAY_PASSWORD doit etre defini (voir .env.example)}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL doit etre defini (voir .env.example)}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD doit etre defini (voir .env.example)}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:?REDIS_PASSWORD doit etre defini (voir .env.example)}
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      - redis

  # Node-RED est géré par gateway/docker-compose.yml (groupe "gateway" dans Docker Desktop)
  # Ne pas le déclarer ici pour éviter les conflits de port 1880 et de container name.

volumes:
  postgres-data:
  redis-data:

networks:
  gateway_default:
    external: true
