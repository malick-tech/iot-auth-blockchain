name: iot-auth

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iot_auth_db
      POSTGRES_USER: malick
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malick"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.4
    environment:
      PGADMIN_DEFAULT_EMAIL: malickass1998@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis

  # Node-RED est géré par gateway/docker-compose.yml (groupe "gateway" dans Docker Desktop)
  # Ne pas le déclarer ici pour éviter les conflits de port 1880 et de container name.

  device-gateway:
    image: python:3.12-slim
    working_dir: /app
    environment:
      - BACKEND_BASE_URL=http://host.docker.internal:8083
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python device_gateway_bridge.py"
    volumes:
      - ../gateway:/app
    networks:
      - default
      - gateway_default

volumes:
  postgres-data:
  redis-data:

networks:
  gateway_default:
    external: true
