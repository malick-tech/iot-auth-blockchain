spring.application.name=iot-auth
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/iot_auth_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

iot.auth.admin-private-key-base64=${IOT_AUTH_ADMIN_PRIVATE_KEY_BASE64:gMjREF3yWSR33vwK82tMfnZnT7Y8JbI9pSpoEbSnmJw=}
iot.auth.jwt-ttl-seconds=3600
iot.auth.nonce-ttl-seconds=60
iot.auth.redis-ttl-seconds=300
iot.auth.vc-validity-days=365

iot.auth.failure-ttl-seconds-challenge=600
iot.auth.failure-threshold-challenge=5

iot.auth.failure-ttl-seconds-vp=300
iot.auth.failure-threshold-vp=3

iot.auth.failure-ttl-seconds-perm=3600
iot.auth.failure-threshold-perm=1

iot.auth.pop-freshness-seconds=30
iot.auth.inactivity-monitor.enabled=true
iot.auth.inactivity-monitor.timeout-seconds=90
iot.auth.inactivity-monitor.initial-delay-ms=30000
iot.auth.inactivity-monitor.scan-interval-ms=30000

iot.auth.algorand.algod-address=http://localhost
iot.auth.algorand.algod-port=4001
iot.auth.algorand.algod-token=${ALGORAND_ALGOD_TOKEN}
iot.auth.algorand.indexer-address=http://localhost
iot.auth.algorand.indexer-port=8980
iot.auth.algorand.indexer-token=${ALGORAND_INDEXER_TOKEN:}
iot.auth.algorand.network=localnet
iot.auth.algorand.app-id=${ALGORAND_APP_ID:1014}
iot.auth.algorand.deployer-mnemonic=${ALGORAND_DEPLOYER_MNEMONIC}

# Récupération automatique des dispositifs bloqués en statut PUBLISHING
# (crash backend entre la confirmation Algorand et l'écriture du txId en base)
iot.auth.algorand.recovery.max-attempts=3
iot.auth.algorand.recovery.scan-interval-ms=300000
iot.auth.algorand.recovery.initial-delay-ms=60000
iot.auth.rate-limit.enabled=true
iot.auth.rate-limit.max-requests=20
iot.auth.rate-limit.window-seconds=60
iot.auth.rate-limit.admin-login.max-requests=5
iot.auth.rate-limit.admin-login.window-seconds=60
iot.auth.admin.jwt-secret=${IOT_AUTH_ADMIN_JWT_SECRET:ZGV2LWFkbWluLWp3dC1zZWNyZXQtZGV2LWFkbWluLWp3dC1zZWNyZXQtZGV2LWFkbWluLWp3dC1zZWNyZXQtZGV2LWFkbQ==}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml

iot.auth.gateway.shared-secret=${IOT_AUTH_GATEWAY_SHARED_SECRET:dev-gateway-secret}

logging.file.name=backend/target/app.log
