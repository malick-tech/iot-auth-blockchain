spring.application.name=iot-auth

spring.datasource.url=jdbc:postgresql://localhost:5432/iot_auth_db
spring.datasource.username=malick
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

iot.auth.admin-private-key-base64=
iot.auth.jwt-ttl-seconds=3600
iot.auth.nonce-ttl-seconds=60
iot.auth.redis-ttl-seconds=300
iot.auth.vc-validity-days=365

iot.auth.algorand.algod-address=http://localhost
iot.auth.algorand.algod-port=4001
iot.auth.algorand.algod-token=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
iot.auth.algorand.indexer-address=http://localhost
iot.auth.algorand.indexer-port=8980
iot.auth.algorand.indexer-token=
iot.auth.algorand.network=localnet

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
