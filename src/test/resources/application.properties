spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

iot.auth.jwt-secret=test-secret-test-secret-test-secret-32
iot.auth.algorand.algod-address=http://localhost
iot.auth.algorand.algod-port=4001
iot.auth.algorand.algod-token=test-token
iot.auth.algorand.indexer-address=http://localhost
iot.auth.algorand.indexer-port=8980
