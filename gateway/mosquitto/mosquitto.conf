# Mosquitto 2.x — configuration pour IoT Auth Gateway
#
# Un seul listener sur toutes les interfaces pour que les clients
# Docker (bridge, node-red) et les clients Windows (simulateur)
# partagent le même bus de messages.

listener 1883 0.0.0.0
allow_anonymous true
persistence false

# Logs de connexion pour le débogage
log_type all

# Desactive l'algorithme de Nagle sur les connexions du broker. Sans cela, l'ACK retarde de
# TCP (~40 ms sous Linux) s'ajoute a chaque aller-retour MQTT QoS 1 et masque la latence
# reelle du chemin cache HIT (valide sur un banc a delais connus : HIT injecte a 2 ms mesure
# a ~44 ms sans l'option, ~2,6 ms avec). A conserver pour toute campagne de mesure.
set_tcp_nodelay true
