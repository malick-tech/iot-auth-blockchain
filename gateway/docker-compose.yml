services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-auth-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  node-red:
    build:
      context: .
      dockerfile: Dockerfile.nodered
    image: iot-auth-nodered:local
    container_name: iot-auth-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
    environment:
      - GATEWAY_SHARED_SECRET=${IOT_AUTH_GATEWAY_SHARED_SECRET:-dev-local-gateway-secret-change-in-prod}
