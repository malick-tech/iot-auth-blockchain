services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-auth-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  node-red:
    image: nodered/node-red:latest
    container_name: iot-auth-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto