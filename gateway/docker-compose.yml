services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-auth-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  node-red:
    build:
      context: .
      dockerfile: Dockerfile.nodered
    image: iot-auth-nodered:local
    container_name: iot-auth-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
    environment:
      - GATEWAY_SHARED_SECRET=${IOT_AUTH_GATEWAY_SHARED_SECRET:?IOT_AUTH_GATEWAY_SHARED_SECRET doit etre defini (voir .env.example)}
      - REDIS_GATEWAY_USERNAME=gateway
      - REDIS_GATEWAY_PASSWORD=${REDIS_GATEWAY_PASSWORD:?REDIS_GATEWAY_PASSWORD doit etre defini (voir .env.example)}
      # Cle publique de l'Issuer EPINGLEE : si definie, la gateway verifie les JWT contre elle et
      # ignore la cle presente dans l'entree Redis (une ecriture Redis ne suffit alors plus a faire
      # accepter un JWT forge). Valeur affichee par le backend au demarrage ("Cle publique Issuer").
      - ISSUER_PUBLIC_KEY=${IOT_AUTH_ISSUER_PUBLIC_KEY:-}
