$kind: http-request
name: 'Pre-register device'
method: POST
url: '{{base_url}}/api/admin/devices'
order: 1000
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "serialNumber": "{{serial_number}}",
      "macAddress": "{{mac_address}}",
      "deviceType": "{{device_type}}",
      "location": "{{location}}",
      "logicalGroup": "{{logical_group}}",
      "responsible": "{{responsible}}"
    }
scripts:
  - type: afterResponse
    language: 'text/javascript'
    code: |-
      pm.test('Status code is 201 Created', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('Device fields are present', () => ['id','serialNumber','status'].forEach(k => pm.expect(json).to.have.property(k)));
      if (json.id) pm.environment.set('device_id', String(json.id));
      if (json.serialNumber) pm.environment.set('serial_number', json.serialNumber);
      if (json.did) pm.environment.set('did', json.did);
