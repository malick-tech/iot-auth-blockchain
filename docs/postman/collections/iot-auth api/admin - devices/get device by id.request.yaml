$kind: http-request
name: 'Get device by id'
method: GET
url: '{{base_url}}/api/admin/devices/:id'
order: 3000
headers:
  - key: Accept
    value: 'application/json'
pathVariables:
  - key: id
    value: '{{device_id}}'
scripts:
  - type: afterResponse
    language: 'text/javascript'
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Device id matches variable', () => pm.expect(String(json.id)).to.eql(pm.variables.get('device_id')));
