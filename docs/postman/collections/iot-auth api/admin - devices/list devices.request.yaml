$kind: http-request
name: 'List devices'
method: GET
url: '{{base_url}}/api/admin/devices'
order: 2000
headers:
  - key: Accept
    value: 'application/json'
queryParams:
  - key: status
    value: '{{status_filter}}'
    description: 'Optionnel : PENDING, ACTIVE, SUSPENDED, REVOKED.'
    disabled: true
scripts:
  - type: afterResponse
    language: 'text/javascript'
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Response is an array', () => pm.expect(pm.response.json()).to.be.an('array'));
