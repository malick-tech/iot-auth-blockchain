$kind: http-request
name: 'Reactivate by serial number'
method: PATCH
url: '{{base_url}}/api/admin/devices/serial/:serialNumber/reactivate'
order: 3000
headers:
  - key: Accept
    value: 'application/json'
pathVariables:
  - key: serialNumber
    value: '{{serial_number}}'
scripts:
  - type: afterResponse
    language: 'text/javascript'
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Device is active', () => pm.expect(json.active).to.eql(true));
