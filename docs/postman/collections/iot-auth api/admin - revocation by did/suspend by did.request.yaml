$kind: http-request
name: 'Suspend by DID'
method: PATCH
url: '{{base_url}}/api/admin/devices/:did/suspend'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
pathVariables:
  - key: did
    value: '{{did}}'
body:
  type: json
  content: |-
    {
      "reason": "{{suspend_reason}}"
    }
scripts:
  - type: afterResponse
    language: 'text/javascript'
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Device is suspended', () => pm.expect(json.suspended).to.eql(true));
